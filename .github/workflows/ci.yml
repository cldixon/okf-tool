name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR supersedes its running checks. Each push to main runs on its own (its group is
# its run id), so one run never holds up the next (TEMPRA-18).
# Deploys are ordered by the job-level groups below, and a deploy job whose commit is no longer the
# tip of main skips itself, so an older run can never overwrite a newer deploy.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  # The Phase 1 gate (import and export Google's sample bundles) and the MCP smoke flow,
  # both over HTTP against `cf dev` with local D1, R2 and Durable Object state.
  gate:
    name: Gate (cf dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Which Chrome the gate drives (CHROME_PATH is unset here, so the runner's Google Chrome).
      - run: google-chrome --version
      - run: mkdir -p gate-diagnostics && bun run gate
        env:
          CF_SEND_TELEMETRY: "false"
          # Each browser step as it starts, so a hang shows where it is; screenshots of failures;
          # Chrome's own log, a trace of a failed flow and the page's state if the browser freezes.
          GATE_TRACE: "1"
          GATE_SCREENSHOTS: ${{ github.workspace }}/gate-diagnostics
          GATE_LOGS: ${{ github.workspace }}/gate-diagnostics
      # Also when the job is cancelled at its time limit, so a hang leaves its evidence.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: gate-diagnostics
          path: gate-diagnostics
          if-no-files-found: ignore

  # worker/ is the deployable project: it must install and build with nothing from the rest of
  # this repository but the two packages it imports. `cf deploy --dry-run` builds and validates
  # without credentials.
  standalone:
    name: worker/ builds on its own (with design/, editor/ and app/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # worker/ plus the packages it imports from the repo (design/, and app/, whose bundle
      # `bun install` builds, with editor/ inside it), under a bare workspace root that, like the
      # real one, builds the app bundle after the install (TEMPRA-51).
      - name: Copy worker/, design/, editor/ and app/ alone, install, build
        run: |
          dest="$RUNNER_TEMP/standalone"
          mkdir -p "$dest"
          git ls-files worker design editor app | tar -cf - -T - | tar -xf - -C "$dest"
          echo '{"private":true,"workspaces":["worker","worker/render","design","editor","app"],"scripts":{"postinstall":"bun run --filter @tempra/app build"}}' > "$dest/package.json"
          cd "$dest"
          bun install
          cd worker
          bunx cf deploy --dry-run
          bun run typecheck
          # The diagram render Worker (TEMPRA-165), which scripts/deploy.ts deploys first.
          cd render
          bunx cf deploy --dry-run
          bun run typecheck
        env:
          CF_SEND_TELEMETRY: "false"

  # The landing page (site/, tempra.dev): Astro check, the Worker's tests, a static build. Its
  # previews and deploys run on Cloudflare Workers Builds, not here (tempra-dev: delivery/site).
  site:
    name: site/ builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build

  # CI/CD (tempra-dev library: delivery/ci-cd). Each stage is off until the operator turns it on
  # with a repository variable, once its prerequisites exist: PREVIEWS, STAGING_DEPLOYS and
  # PRODUCTION_DEPLOYS = on. Production follows staging in the same run, with no approval step
  # (tempra-dev: decisions/production-without-approval); a required reviewer on the `production`
  # environment would add one back.

  # PR #N's own Worker on pr-N.tempra.dev (delivery/preview-deployments). Not for forks: their
  # runs get no secrets.
  preview:
    name: Preview deployment
    needs: [check, gate, standalone]
    if: >-
      github.event_name == 'pull_request' && vars.PREVIEWS == 'on' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    # Shared with the teardown in preview-cleanup.yml: a newer push, or closing the PR, wins.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.up.outputs.url }}
    env:
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEMPRA_PREVIEW_EMAIL: ${{ secrets.PREVIEW_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: up
        working-directory: worker
        # Only this step sees the key: `preview up` sets it on the preview Worker as a secret.
        # The seed library (TEMPRA-109, delivery/preview-deployments): `preview up` copies it into
        # the preview with the read-only token; with no PREVIEW_SEED_LIBRARY it seeds the samples.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREVIEW_SEED_LIBRARY: ${{ vars.PREVIEW_SEED_LIBRARY }}
          PREVIEW_SEED_URL: ${{ vars.PREVIEW_SEED_URL }}
          PREVIEW_SEED_TOKEN: ${{ secrets.PREVIEW_SEED_TOKEN }}
        run: bun run preview up --pr ${{ github.event.pull_request.number }}
      - name: Comment the URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.up.outputs.url }}
          LIBRARY_URL: ${{ steps.up.outputs.library_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- tempra-preview -->"
          if [ -n "$LIBRARY_URL" ]; then
            body="Preview: $LIBRARY_URL (at ${SHA:0:7}). Torn down when this PR closes.
          $marker"
          else
            body="Preview: $URL (at ${SHA:0:7}). Torn down when this PR closes.
          $marker"
          fi
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

  # Every merge to main: migrations, deploy, then a check against the live staging Worker.
  staging:
    name: Deploy staging
    needs: [check, gate, standalone]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOYS == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.tip.outputs.deploy }}
    environment:
      name: staging
      url: https://staging.tempra.dev
    env:
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_TOKEN: ${{ secrets.STAGING_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Still the tip of main?
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"
          else echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "::notice::Superseded by $tip; not deploying $GITHUB_SHA."; fi
      - if: steps.tip.outputs.deploy == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - if: steps.tip.outputs.deploy == 'true'
        run: bun install --frozen-lockfile
      - if: steps.tip.outputs.deploy == 'true'
        working-directory: worker
        run: bun run deploy --mode staging --message "${{ github.sha }}"
      # The managed agent's model key (TEMPRA-222), from the GitHub secret through Cloudflare's
      # API; skipped quietly when the secret is empty.
      - if: steps.tip.outputs.deploy == 'true'
        name: Set the agent's key
        working-directory: worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun scripts/worker-secret.ts --mode staging --name ANTHROPIC_API_KEY
      - if: steps.tip.outputs.deploy == 'true'
        name: Check staging
        working-directory: worker
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://staging.tempra.dev/healthz
          # Signed out, the root is the landing page (TEMPRA-276).
          curl -fsS https://staging.tempra.dev/ | grep -q '/sign-in"'
          if [ -n "$SMOKE_TOKEN" ]; then
            bun scripts/mcp-smoke.ts --url https://staging.tempra.dev --token "$SMOKE_TOKEN"
          fi

  # After staging, in the `production` environment (no required reviewer, so nothing waits). A run
  # whose commit is no longer the tip of main skips the deploy.
  production:
    name: Deploy production
    needs: [staging]
    # A run whose commit was superseded before staging never deploys production.
    if: vars.PRODUCTION_DEPLOYS == 'on' && needs.staging.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.tip.outputs.deploy }}
    environment:
      name: production
      url: https://tempra.dev
    env:
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_TOKEN: ${{ secrets.PRODUCTION_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Still the tip of main?
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"
          else echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "::notice::Superseded by $tip; not deploying $GITHUB_SHA."; fi
      - if: steps.tip.outputs.deploy == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - if: steps.tip.outputs.deploy == 'true'
        run: bun install --frozen-lockfile
      - if: steps.tip.outputs.deploy == 'true'
        working-directory: worker
        env:
          # Where incoming mail to the config's addresses is forwarded (inboundMail, hello@tempra.dev).
          OPERATOR_EMAIL: ${{ secrets.PREVIEW_EMAIL }}
        run: bun run deploy --mode production --message "${{ github.sha }}"
      - if: steps.tip.outputs.deploy == 'true'
        name: Set the agent's key
        working-directory: worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun scripts/worker-secret.ts --mode production --name ANTHROPIC_API_KEY
      - if: steps.tip.outputs.deploy == 'true'
        name: Check production
        working-directory: worker
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://tempra.dev/healthz
          # The former host stays for existing connections (TEMPRA-276), www redirects, and the
          # root is the landing page to someone signed out.
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://app.tempra.dev/healthz
          test "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' https://www.tempra.dev/)" = "301 https://tempra.dev/"
          curl -fsS https://tempra.dev/ | grep -q '/sign-in"'
          if [ -n "$SMOKE_TOKEN" ]; then
            bun scripts/mcp-smoke.ts --url https://tempra.dev --token "$SMOKE_TOKEN" --read-only
            bun scripts/mcp-smoke.ts --url https://app.tempra.dev --token "$SMOKE_TOKEN" --read-only
          fi

  # The operator's portal (TEMPRA-278, admin/): after each app deploy it binds to, in jobs of their
  # own so a failure here never holds the app back. Off until the repository variable ADMIN_DEPLOYS
  # is `on` (the API token needs the Access permissions first; admin/scripts/deploy.ts says which).
  # The deploy makes sure of Cloudflare Access (one-time PIN, only OPERATOR_EMAIL, 2-hour sessions)
  # before deploying, and the check asks the host with no sign-in: Access must answer, not the page.
  admin-staging:
    name: Deploy the admin portal (staging)
    needs: [staging]
    if: vars.ADMIN_DEPLOYS == 'on' && needs.staging.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-admin-staging
      cancel-in-progress: false
    env:
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - working-directory: admin
        env:
          OPERATOR_EMAIL: ${{ secrets.PREVIEW_EMAIL }}
          ANALYTICS_TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
        run: bun run deploy --mode staging
      - name: Signed out, Access answers
        run: |
          got=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --retry 5 --retry-delay 6 https://admin-staging.tempra.dev/)
          echo "$got"
          case "$got" in "302 https://"*".cloudflareaccess.com/"*) ;; *) exit 1 ;; esac

  admin-production:
    name: Deploy the admin portal (production)
    needs: [production]
    if: vars.ADMIN_DEPLOYS == 'on' && needs.production.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-admin-production
      cancel-in-progress: false
    env:
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - working-directory: admin
        env:
          OPERATOR_EMAIL: ${{ secrets.PREVIEW_EMAIL }}
          ANALYTICS_TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
        run: bun run deploy --mode production
      - name: Signed out, Access answers
        run: |
          got=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --retry 5 --retry-delay 6 https://admin.tempra.dev/)
          echo "$got"
          case "$got" in "302 https://"*".cloudflareaccess.com/"*) ;; *) exit 1 ;; esac
