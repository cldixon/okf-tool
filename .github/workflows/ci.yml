name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  # The Phase 1 gate (import and export Google's sample bundles) and the MCP smoke flow,
  # both over HTTP against `cf dev` with local D1, R2 and Durable Object state.
  gate:
    name: Gate (cf dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run gate
        env:
          CF_SEND_TELEMETRY: "false"

  # worker/ is the deployable project: it must install and build with nothing from the rest of
  # this repository. `cf deploy --dry-run` builds and validates without credentials.
  standalone:
    name: worker/ builds on its own
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Copy worker/ alone, install, build
        run: |
          dest="$RUNNER_TEMP/worker"
          mkdir -p "$dest"
          git ls-files worker | sed 's#^worker/##' | (cd worker && tar -cf - -T -) | tar -xf - -C "$dest"
          cd "$dest"
          bun install
          bunx cf deploy --dry-run
          bun run typecheck
        env:
          CF_SEND_TELEMETRY: "false"
